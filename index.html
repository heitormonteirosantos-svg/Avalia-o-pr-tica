<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Acessível</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Portal da Terceira Idade</h1>
    <div class="controles">
      <button id="btn-fonte-aumentar" aria-label="Aumentar tamanho do texto">A+</button>
      <button id="btn-fonte-diminuir" aria-label="Diminuir tamanho do texto">A-</button>
      <button id="btn-tema" aria-label="Alternar entre modo claro e escuro">Modo Escuro</button>
    </div>
  </header>

  <main>
    <section class="cartao">
      <h2>Bem-vindo ao nosso espaço</h2>
      <p>Este site foi projetado com letras maiores, botões destacados e visual limpo para facilitar sua leitura e navegação.</p>
    </section>

    <section class="cartao">
      <h2>Dicas de Saúde e Bem-Estar</h2>
      <p>Mantenha uma rotina de caminhadas leves e lembre-se de beber água regularmente ao longo do dia.</p>
      <button class="btn-acao">Saiba Mais</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
